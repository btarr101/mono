# Publishes the public crates that changed since their last release, using the
# vendored cargo-smart-release in public/apps/cargo-smart-release. It generates
# a changelog, publishes to crates.io, tags the release, and creates a GitHub
# release. Versions are controlled by hand: bump the `version` in Cargo.toml
# and merge. On pull requests it only runs the dry-run plan, including
# `cargo publish --dry-run` for the crates that would ship.
on:
    push:
        branches:
            - main
        paths:
            # Any published crate change on main re-runs the plan, which fails
            # when a crate's source moved without a version bump.
            - "public/libs/**"
    pull_request:
        paths:
            # A release PR is one that bumps a crate version.
            - "public/libs/**/Cargo.toml"
    workflow_dispatch:

permissions:
    # Needed to push the generated changelog commit and release tags, and to
    # create GitHub releases.
    contents: write

concurrency:
    group: publish-crates
    cancel-in-progress: false

jobs:
    publish:
        name: 📦 Publish crates
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: public
        steps:
            - name: Checkout
              uses: actions/checkout@v6
              with:
                  # Changelog generation walks the full history since the last
                  # release tag.
                  fetch-depth: 0

            - name: Checkout cargo-smart-release
              # Only the tool is needed. `submodules: recursive` is avoided
              # because the `private` submodule is private and not available
              # with this token.
              run: git -C .. submodule update --init public/apps/cargo-smart-release

            - name: Install Rust toolchain
              # The public crates use nightly features, and `cargo publish`
              # verifies by building the crate.
              uses: dtolnay/rust-toolchain@nightly

            - name: Resolve cargo-smart-release revision
              id: csr
              run: echo "sha=$(git -C apps/cargo-smart-release rev-parse HEAD)" >> "$GITHUB_OUTPUT"

            - name: Restore cargo-smart-release
              # Keyed on the pinned submodule commit: bumping the submodule
              # rebuilds, an unchanged tool restores in seconds instead of
              # compiling gix from scratch (~2.5 min on a cold runner).
              id: csr-cache
              uses: actions/cache@v4
              with:
                  path: ~/.cargo/bin/cargo-smart-release
                  key: cargo-smart-release-${{ runner.os }}-${{ runner.arch }}-${{ steps.csr.outputs.sha }}

            - name: Cache cargo-smart-release build
              # Only runs on a cache miss, so the ~1s hit path stays untouched.
              # The tool is its own workspace, so its artifacts land in its own
              # `target/`, keeping the rebuild incremental after a submodule
              # bump instead of recompiling gix from scratch.
              if: steps.csr-cache.outputs.cache-hit != 'true'
              uses: Swatinem/rust-cache@v2
              with:
                  workspaces: public/apps/cargo-smart-release -> target

            - name: Install cargo-smart-release
              # Vendored build carrying the fix that resolves crate paths
              # against the git repository root, so a workspace in `public/`
              # works. The probe also catches a restored binary that no longer
              # runs on a newer runner image, which is when we rebuild.
              # `--version` is unavailable (it needs a build-time env var), but
              # the top-level `--help` flag is always generated by clap.
              run: |
                  if ! "$HOME/.cargo/bin/cargo-smart-release" --help >/dev/null 2>&1; then
                    cargo install --path apps/cargo-smart-release --locked
                  fi

            - name: Configure git identity
              run: |
                  git config user.name "publish-crates[bot]"
                  git config user.email "publish-crates[bot]@users.noreply.github.com"

            - name: Release
              run: |
                  git fetch --tags --force
                  cargo smart-release \
                    $(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.publish != []) | .name') \
                    $EXECUTE \
                    $DRY_RUN \
                    --bump keep \
                    --bump-dependencies keep \
                    --allow-fully-generated-changelogs \
                    --allow-empty-release-message \
                    --no-changelog-preview \
                    --changelog-github-release-for-namespaced-tags
              env:
                  CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  # Publish on push/manual dispatch; on PRs plan and verify
                  # packaging without publishing.
                  EXECUTE: ${{ github.event_name != 'pull_request' && '--execute' || '' }}
                  DRY_RUN: ${{ github.event_name == 'pull_request' && '--dry-run-cargo-publish' || '' }}

name: Publish crates

# Publishes every workspace crate whose current version is not yet on
# crates.io. Bump the version in a crate's Cargo.toml, merge, and it ships.
# No commit message conventions involved.
on:
  push:
    branches:
      - main
    paths:
      - 'public/**'
      - '.github/workflows/publish_crates.yml'
  workflow_dispatch:

concurrency:
  group: publish-crates
  cancel-in-progress: false

jobs:
  publish:
    name: Publish unpublished crates
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        # The public crates use nightly features, and `cargo publish` verifies
        # by building the crate.
        uses: dtolnay/rust-toolchain@nightly

      - name: Publish crates
        uses: katyo/publish-crates@v2
        with:
          path: ./public
          registry-token: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          # Fail if a crate's source changed after its published version
          # without a matching version bump.
          check-repo: true
          # Do not swallow that consistency error.
          ignore-unpublished-changes: false

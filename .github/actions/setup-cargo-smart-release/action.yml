name: Setup cargo-smart-release
description: |
    Provide the vendored cargo-smart-release binary. The binary is restored
    from cache keyed on the pinned submodule revision, and rebuilt only when it
    is missing or no longer runs on the current runner image.

# Both callers check the public workspace out at the repository root and
# initialize the vendored tool there, so the path is stable.
runs:
    using: composite
    steps:
        - name: Checkout tool submodule
          # Both callers check the public workspace out at the repository root.
          # Only this submodule is needed: `submodules: recursive` would also
          # try the private `private` submodule, which the token cannot reach.
          shell: bash
          working-directory: ${{ github.workspace }}
          run: git submodule update --init public/apps/cargo-smart-release

        - name: Resolve revision
          id: csr
          shell: bash
          working-directory: ${{ github.workspace }}
          run: echo "sha=$(git -C public/apps/cargo-smart-release rev-parse HEAD)" >> "$GITHUB_OUTPUT"

        - name: Restore binary
          id: csr-cache
          uses: actions/cache@v4
          with:
              path: ~/.cargo/bin/cargo-smart-release
              key: cargo-smart-release-${{ runner.os }}-${{ runner.arch }}-${{ steps.csr.outputs.sha }}

        - name: Restore build artifacts
          # Only on a binary cache miss. The tool is its own workspace, so this
          # keeps the rebuild incremental after a submodule bump instead of
          # recompiling gix from scratch.
          if: steps.csr-cache.outputs.cache-hit != 'true'
          uses: Swatinem/rust-cache@v2
          with:
              workspaces: public/apps/cargo-smart-release -> target

        - name: Install if needed
          # `--version` is unavailable (it needs a build-time env var), but the
          # top-level `--help` flag is always generated by clap. The probe also
          # catches a restored binary that no longer runs on a newer runner
          # image, which is when we rebuild.
          shell: bash
          working-directory: ${{ github.workspace }}
          run: |
              if ! "$HOME/.cargo/bin/cargo-smart-release" --help >/dev/null 2>&1; then
                cargo install --path public/apps/cargo-smart-release --locked
              fi
